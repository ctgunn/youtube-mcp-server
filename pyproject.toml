[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-mcp-server"
version = "0.1.0"
description = "MCP-compliant YouTube server for Cloud Run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "redis>=5.0,<6.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=9.0,<10.0",
  "ruff>=0.16,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/mcp_server"]
python_version = "3.11"
warn_unused_configs = true
