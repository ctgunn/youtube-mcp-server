[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-mcp-server"
version = "0.1.0"
description = "MCP-compliant YouTube server for Cloud Run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "redis>=5.0,<6.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=9.0,<10.0",
  "ruff>=0.16,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Public request validation intentionally raises ValueError so the shared MCP
# error mapper preserves invalid-input semantics instead of reporting a type
# implementation failure to clients.
ignore = ["TRY004"]

[tool.mypy]
files = ["src/mcp_server"]
python_version = "3.11"
warn_unused_configs = true

# The Layer 2/3 YouTube tool catalog accepts representative JSON payloads and
# test-double executors that predate repository type checking. Keep the initial
# OPS-401 gate strict everywhere else while a dedicated type-quality slice
# migrates those legacy contracts to precise mapping and executor protocols.
[[tool.mypy.overrides]]
module = ["mcp_server.tools.youtube_common.*", "mcp_server.tools.youtube_composed.*"]
disable_error_code = ["arg-type", "call-overload", "dict-item", "index", "operator", "return-value", "union-attr"]
