steps:
  - id: resolve-source-revision
    name: python:3.11
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        source_revision="${COMMIT_SHA:-}"
        if [ -d .git ]; then
          checked_out_revision="$(git rev-parse HEAD)"
          if [ -n "${source_revision}" ] && [ "${source_revision}" != "${checked_out_revision}" ]; then
            echo "Resolved source revision does not match the checked-out source." >&2
            exit 1
          fi
          source_revision="${checked_out_revision}"
        fi
        [[ "${source_revision}" =~ ^[0-9a-f]{40}$ ]]
        mkdir -p artifacts
        printf '%s\n' "${source_revision}" > artifacts/source-revision.txt

  - id: validate-bootstrap-prerequisites
    name: python:3.11
    entrypoint: bash
    env:
      - GCP_PROJECT_ID=${PROJECT_ID}
      - GCP_REGION=${_GCP_REGION}
      - GCP_SERVICE_NAME=${_GCP_SERVICE_NAME}
      - GCP_ARTIFACT_REGISTRY_REPOSITORY=${_GCP_ARTIFACT_REGISTRY_REPOSITORY}
      - GCP_TERRAFORM_VAR_FILE=${_GCP_TERRAFORM_VAR_FILE}
      - GCP_WORKLOAD_IDENTITY_PROVIDER=cloud-build-managed
      - GCP_SERVICE_ACCOUNT=${_GCP_SERVICE_ACCOUNT_EMAIL}
    args:
      - -lc
      - |
        set -euo pipefail
        missing=()
        for key in GCP_PROJECT_ID GCP_REGION GCP_SERVICE_NAME GCP_ARTIFACT_REGISTRY_REPOSITORY GCP_TERRAFORM_VAR_FILE GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
          if [ -z "${!key:-}" ]; then
            missing+=("${key}")
          fi
        done
        if [ "${#missing[@]}" -ne 0 ]; then
          printf 'Missing safe preflight prerequisites: %s\n' "${missing[*]}" >&2
          exit 1
        fi

  - id: quality-gate
    name: python:3.11
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]'
        make quality

  - id: configure-docker-auth
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -lc
      - gcloud auth configure-docker us-docker.pkg.dev --quiet

  - id: build-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        source_revision="$(cat artifacts/source-revision.txt)"
        image_tag="us-docker.pkg.dev/${PROJECT_ID}/${_GCP_ARTIFACT_REGISTRY_REPOSITORY}/${_IMAGE_NAME}:${source_revision}"
        docker build -t "${image_tag}" .
        printf '%s\n' "${image_tag}" > artifacts/image-tag.txt

  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -lc
      - docker push "$(cat artifacts/image-tag.txt)"

  - id: resolve-image-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        image_tag="$(cat artifacts/image-tag.txt)"
        image_digest="$(gcloud artifacts docker images describe "${image_tag}" --format='value(image_summary.digest)')"
        [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
        image_reference="${image_tag}@${image_digest}"
        printf '%s\n' "${image_reference}" > artifacts/image-reference.txt

  - id: record-release-provenance
    name: python:3.11
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        SOURCE_REVISION="$(cat artifacts/source-revision.txt)" IMAGE_REFERENCE="$(cat artifacts/image-reference.txt)" TARGET_ENVIRONMENT="${_TARGET_ENVIRONMENT}" python - <<'PY'
        import json
        import os
        from pathlib import Path

        image_reference = os.environ["IMAGE_REFERENCE"]
        payload = {
            "sourceRevision": os.environ["SOURCE_REVISION"],
            "imageReference": image_reference,
            "imageDigest": image_reference.rsplit("@", 1)[1],
            "targetEnvironment": os.environ["TARGET_ENVIRONMENT"],
            "qualityStatuses": {"lint": "pass", "typecheck": "pass", "tests": "pass"},
            "preflightStatus": "pass",
            "deploymentRevision": None,
            "verificationStatus": "pending",
        }
        Path("artifacts/release-provenance.json").write_text(json.dumps(payload, sort_keys=True))
        PY

  - id: terraform-init
    name: hashicorp/terraform:1.9.8
    entrypoint: sh
    args:
      - -lc
      - terraform -chdir=infrastructure/gcp init

  - id: terraform-apply
    name: Reconcile managed network bootstrap and infrastructure
    name: hashicorp/terraform:1.9.8
    entrypoint: sh
    args:
      - -lc
      - terraform -chdir=infrastructure/gcp apply -auto-approve -var-file="${_GCP_TERRAFORM_VAR_FILE}"

  - id: export-terraform-outputs
    name: hashicorp/terraform:1.9.8
    entrypoint: sh
    args:
      - -lc
      - |
        mkdir -p artifacts
        terraform -chdir=infrastructure/gcp output -json > artifacts/gcp-foundation-outputs.json

  - id: deploy-hosted-revision
    name: Deploy hosted revision (immutable image)
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv:
      - MCP_AUTH_TOKEN
    env:
      - INFRA_OUTPUTS_FILE=artifacts/gcp-foundation-outputs.json
      - DEPLOYMENT_RECORD_FILE=artifacts/cloud-run-deployment.json
      - RELEASE_PROVENANCE_FILE=artifacts/release-provenance.json
      - GCLOUD_BIN=gcloud
      - SERVICE_ACCOUNT_EMAIL=${_GCP_SERVICE_ACCOUNT_EMAIL}
      - TARGET_ENVIRONMENT=${_TARGET_ENVIRONMENT}
      - QUALITY_LINT_STATUS=pass
      - QUALITY_TYPECHECK_STATUS=pass
      - QUALITY_TESTS_STATUS=pass
      - PREFLIGHT_STATUS=pass
    args:
      - -lc
      - |
        set -euo pipefail
        python3 -m pip install -e .
        SOURCE_REVISION="$(cat artifacts/source-revision.txt)" IMAGE_REFERENCE="$(cat artifacts/image-reference.txt)" bash scripts/deploy_cloud_run.sh

  - id: verify-hosted-deployment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv:
      - MCP_AUTH_TOKEN
    env:
      - PYTHONPATH=src
    args:
      - -lc
      - |
        set +e
        python3 -m pip install -e .
        python3 scripts/verify_cloud_run_foundation.py \
          --deployment-record artifacts/cloud-run-deployment.json \
          --auth-token "${MCP_AUTH_TOKEN}" \
          --evidence-file artifacts/cloud-run-verification.txt \
          --summary-file artifacts/cloud-run-verification.json
        verification_result=$?
        set -e
        VERIFICATION_STATUS=fail
        if [ "${verification_result}" -eq 0 ]; then VERIFICATION_STATUS=pass; fi
        VERIFICATION_STATUS="${VERIFICATION_STATUS}" python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        path = Path("artifacts/release-provenance.json")
        payload = json.loads(path.read_text())
        payload["verificationStatus"] = os.environ["VERIFICATION_STATUS"]
        path.write_text(json.dumps(payload, sort_keys=True))
        PY
        exit "${verification_result}"

substitutions:
  _GCP_REGION: us-central1
  _GCP_SERVICE_NAME: youtube-mcp-server
  _GCP_ARTIFACT_REGISTRY_REPOSITORY: apps
  _GCP_TERRAFORM_VAR_FILE: staging.tfvars
  _GCP_SERVICE_ACCOUNT_EMAIL: youtube-mcp-server@${PROJECT_ID}.iam.gserviceaccount.com
  _IMAGE_NAME: youtube-mcp-server
  _TARGET_ENVIRONMENT: staging

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/YOUTUBE_API_KEY/versions/latest
      env: YOUTUBE_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/MCP_AUTH_TOKEN/versions/latest
      env: MCP_AUTH_TOKEN

artifacts:
  objects:
    location: gs://${PROJECT_ID}_cloudbuild/ops-401
    paths:
      - artifacts/source-revision.txt
      - artifacts/image-reference.txt
      - artifacts/release-provenance.json
      - artifacts/gcp-foundation-outputs.json
      - artifacts/cloud-run-deployment.json
      - artifacts/cloud-run-verification.json
      - artifacts/cloud-run-verification.txt

options:
  logging: CLOUD_LOGGING_ONLY
